# Nixpacks (Railway) — document root is public/
[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

# Ensure custom nginx.template.conf is used (paper-sheet uploads up to 12 MB).
[start]
cmd = "node /assets/scripts/prestart.mjs /app/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
